<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truco Brasileiro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="score-panel">
        <div class="panel-title">PLACAR</div>
        <div class="score-row">
          <span>VOCÊ + PARCEIRO</span>
          <strong id="scoreYou">0</strong>
        </div>
        <div class="score-row">
          <span>ADVERSÁRIOS</span>
          <strong id="scoreOpp">0</strong>
        </div>
        <div class="bet-box">
          <span>MÃO</span>
          <strong id="betValue">1</strong>
        </div>
      </aside>

      <section class="table-area">
        <div class="table-surface">
          <div class="player-slot player-top-left" data-role="opp1">
            <div class="player-label">ADVERSÁRIO 1</div>
            <div id="hand-opp1" class="hand hand-back" aria-label="Mão do adversário 1"></div>
          </div>

          <div class="player-slot player-top-center" data-role="partner">
            <div class="player-label">SEU PARCEIRO</div>
            <div id="hand-partner" class="hand hand-back" aria-label="Mão do parceiro"></div>
          </div>

          <div class="player-slot player-top-right" data-role="opp2">
            <div class="player-label">ADVERSÁRIO 2</div>
            <div id="hand-opp2" class="hand hand-back" aria-label="Mão do adversário 2"></div>
          </div>

          <div class="center-stage">
            <div class="turn-banner" id="turnBanner">SUA VEZ</div>
            <div class="vira-box">
              <div class="vira-label">VIRA</div>
              <div id="viraCard" class="vira-card"></div>
            </div>
            <div class="played-area" id="playedArea"></div>
          </div>

          <div class="player-slot player-bottom" data-role="you">
            <div class="hand-container">
              <div id="hand-you" class="hand hand-player" aria-label="Sua mão"></div>
            </div>
            <div class="player-label self">VOCÊ</div>
          </div>
        </div>
      </section>

      <div class="action-row">
        <button id="trucoBtn" class="action-button primary">🔥 TRUCO</button>
        <button id="signalBtn" class="action-button">💬 SINAIS</button>
        <button id="musicBtn" class="action-button">🎵 MÚSICA: ON</button>
        <button id="newGameBtn" class="action-button secondary">↻ NOVA PARTIDA</button>
      </div>

      <div id="signalPanel" class="signal-panel hidden" aria-live="polite">
        <div class="signal-header">Sinais do parceiro</div>
        <div class="signal-grid">
          <button class="signal-btn" data-signal="Tenho jogo!">👍 Tenho jogo!</button>
          <button class="signal-btn" data-signal="Estou fraco">😅 Estou fraco</button>
          <button class="signal-btn" data-signal="Confia em mim">🤝 Confia em mim</button>
          <button class="signal-btn" data-signal="Peça Truco">🔥 Peça Truco</button>
          <button class="signal-btn" data-signal="Tenho manilha">🃏 Tenho manilha</button>
          <button class="signal-btn" data-signal="Não tenho nada">🤫 Não tenho nada</button>
        </div>
      </div>

      <div class="chat-panel">
        <div class="chat-header">CHAT</div>
        <div id="chatLog" class="chat-log"></div>
      </div>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
